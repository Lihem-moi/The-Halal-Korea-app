<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Halal Korea</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-green: #2e7d32; --accent-gold: #fbc02d; --bg-light: #f8f9fa; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: white; }
        
        #map { width: 100%; height: 100%; background: #e5e3df; z-index: 1; }

        /* Interface du haut */
        .top-interface { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); z-index: 2000; width: 90%; max-width: 400px; }
        .search-wrapper { position: relative; margin-bottom: 12px; }
        .search-bar { width: 100%; padding: 12px 12px 12px 45px; border-radius: 30px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 16px; outline: none; box-sizing: border-box; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); }

        .filters-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .filter-btn { background: white; border: none; padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.1); color: #555; }

        /* Panneaux Coulissants */
        .view-panel { 
            position: absolute; bottom: -100%; left: 0; width: 100%; height: 85%; 
            background: var(--bg-light); z-index: 3000; border-radius: 30px 30px 0 0; 
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1);
            padding: 25px; box-sizing: border-box; overflow-y: auto;
        }
        .view-panel.active { bottom: 0; }

        /* Écran Profil Style */
        .profile-header { text-align: center; margin-bottom: 30px; }
        .profile-pic { width: 90px; height: 90px; background: #ddd; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .profile-menu { list-style: none; padding: 0; margin: 0; }
        .menu-item { background: white; padding: 15px 20px; border-radius: 15px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }
        .menu-item span { display: flex; align-items: center; gap: 15px; font-weight: 500; color: #333; }
        .logout { color: #e91e63 !important; margin-top: 20px; justify-content: center !important; font-weight: bold !important; }

        /* Navigation Bas */
        .bottom-nav { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 4000; width: 90%; max-width: 400px; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-radius: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .nav-item { color: #888; font-size: 20px; border: none; background: none; cursor: pointer; text-align: center; outline: none; }
        .nav-item.active { color: var(--main-green); }
        .nav-label { font-size: 10px; font-weight: bold; display: block; }

        .locate-btn { position: absolute; bottom: 115px; right: 20px; z-index: 2000; background: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: none; font-size: 22px; }
    </style>
</head>
<body>

    <div class="top-interface">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-bar" placeholder="Chercher Itaewon...">
        </div>
        <div class="filters-container">
            <button class="filter-btn">🕌 Mosquées</button>
            <button class="filter-btn">🤲🏻 Salles de prière</button>
        </div>
    </div>

    <div id="map"></div>
    <button class="locate-btn" onclick="findMe()">📍</button>

    <div id="panel-profile" class="view-panel">
        <div style="display: flex; justify-content: flex-end;"><span onclick="showView('map')" style="font-size: 24px; cursor: pointer;">✕</span></div>
        
        <div class="profile-header">
            <div class="profile-pic">👤</div>
            <h2 style="margin: 0;">Mon Compte</h2>
            <p style="color: #888; font-size: 14px;">Bienvenue sur The Halal Korea</p>
        </div>

        <div class="profile-menu">
            <div class="menu-item"><span>⚙️ Paramètres</span> ❯</div>
            <div class="menu-item"><span>🔔 Notifications</span> ❯</div>
            <div class="menu-item"><span>🌍 Langue (Français)</span> ❯</div>
            <div class="menu-item"><span>💬 Aide & Contact</span> ❯</div>
            <div class="menu-item logout">Déconnexion</div>
        </div>
    </div>

    <div id="panel-fav" class="view-panel">
        <div style="display: flex; justify-content: flex-end;"><span onclick="showView('map')" style="font-size: 24px; cursor: pointer;">✕</span></div>
        <h2>Mes Favoris ⭐</h2>
        <p style="color: #999; text-align: center; margin-top: 50px;">Vos favoris apparaîtront ici.</p>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showView('map')">📍<span class="nav-label">Carte</span></button>
        <button class="nav-item" onclick="showView('fav')">⭐<span class="nav-label">Favoris</span></button>
        <button class="nav-item" onclick="showView('profile')">👤<span class="nav-label">Profil</span></button>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', { zoomControl: false }).setView([37.5332, 126.9977], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { noWrap: true }).addTo(map);

        var userMarker; // Variable pour garder le pin bleu

        function findMe() {
            map.locate({setView: true, maxZoom: 16});
        }

        // --- GESTION DU PIN BLEU (Ta demande) ---
        map.on('locationfound', function(e) {
            // Si le pin existe déjà, on le déplace, sinon on le crée
            if (userMarker) {
                userMarker.setLatLng(e.latlng);
            } else {
                userMarker = L.circleMarker(e.latlng, {
                    radius: 8,
                    fillColor: "#2196F3",
                    color: "white",
                    weight: 3,
                    opacity: 1,
                    fillOpacity: 1
                }).addTo(map).bindPopup("Vous êtes ici").openPopup();
            }
        });

        map.on('locationerror', function() {
            alert("Impossible de trouver votre position. Vérifiez votre GPS !");
        });

        // Navigation
        function showView(view) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            if(view === 'fav') {
                document.getElementById('panel-fav').classList.add('active');
                document.querySelectorAll('.nav-item')[1].classList.add('active');
            } else if(view === 'profile') {
                document.getElementById('panel-profile').classList.add('active');
                document.querySelectorAll('.nav-item')[2].classList.add('active');
            } else {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
            }
        }

        window.onload = function() { setTimeout(function(){ map.invalidateSize(); }, 500); };
    </script>
</body>
</html>

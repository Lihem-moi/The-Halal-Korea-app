<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Halal Korea</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2972/2972531.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="The Halal Korea">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-green: #2e7d32; --accent-gold: #fbc02d; --bg-light: #f8f9fa; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #map { 
    position: absolute;
    top: 0;
    bottom: 0;
    width: 100%; 
    height: 100%; 
    z-index: 1; 
    background: #f0f0f0; /* Évite l'écran noir pendant le chargement */
}


        /* Interface */
        .top-interface { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); z-index: 2000; width: 90%; max-width: 400px; }
        .search-bar { width: 100%; padding: 12px 12px 12px 45px; border-radius: 30px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 16px; outline: none; box-sizing: border-box; }
        .search-icon { position: absolute; left: 15px; top: 13px; z-index: 2001; }

        /* Filtres */
        .filters { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
        .filter-tag { background: white; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: none; }

        /* Panneaux */
        .view-panel { position: absolute; bottom: -100%; left: 0; width: 100%; height: 80%; background: var(--bg-light); z-index: 3000; border-radius: 30px 30px 0 0; transition: bottom 0.4s ease; padding: 25px; box-sizing: border-box; overflow-y: auto; }
        .view-panel.active { bottom: 0; }

        /* Nav */
        .bottom-nav { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 4000; width: 90%; max-width: 400px; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-radius: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .nav-item { border: none; background: none; color: #888; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--main-green); }

        .locate-btn { position: absolute; bottom: 115px; right: 20px; z-index: 2000; background: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: none; font-size: 22px; }
        #toast { position: absolute; top: -60px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 25px; border-radius: 30px; z-index: 5000; transition: top 0.4s; }

        .leaflet-container {
    background: #242424 !important; /* Un fond sombre si la carte charge lentement */
}

    </style>
</head>
<body>

    <div id="toast"></div>

    <div class="top-interface">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-bar" placeholder="Chercher Itaewon...">
        <div class="filters">
            <button class="filter-tag">🕌 Mosquées</button>
            <button class="filter-tag">🤲🏻 Salles de prière</button>
            <button class="filter-tag">🍜 Restaurants</button>
        </div>
    </div>

    <div id="map"></div>
    <button class="locate-btn" onclick="findMe()">📍</button>

    <div id="panel-fav" class="view-panel">
        <div style="display:flex; justify-content:space-between;"><h2>Mes Favoris ⭐</h2><span onclick="closePanels()" style="font-size:24px;">✕</span></div>
        <div id="fav-list"></div>
    </div>

    <div id="panel-profile" class="view-panel">
        <div style="display:flex; justify-content:space-between;"><h2>Mon Profil 👤</h2><span onclick="closePanels()" style="font-size:24px;">✕</span></div>
        <div style="text-align:center; padding:20px;">
            <div style="width:80px; height:80px; background:#ddd; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:30px;">👤</div>
            <h3>Explorateur Corée</h3>
            <p>Membre depuis 2026</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showView('map')">📍<br><small>Carte</small></button>
        <button class="nav-item" onclick="showView('fav')">⭐<br><small>Favoris</small></button>
        <button class="nav-item" onclick="showView('profile')">👤<br><small>Profil</small></button>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        
// 1. On crée la carte sans le logo Leaflet
var map = L.map('map', { 
    zoomControl: false, 
    attributionControl: false,
    worldCopyJump: false // Empêche la carte de "sauter"
}).setView([37.5332, 126.9977], 15);

// 2. On charge les images de la carte avec l'option "noWrap" (très important !)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    noWrap: true, // EMPECHE LA REPETITION DE LA CARTE
    bounds: [[-90, -180], [90, 180]] // Garde les images dans les limites du monde
}).addTo(map);

// 3. On force la carte à se recalibrer après un court instant
setTimeout(function(){ 
    map.invalidateSize(); 
}, 400);

        let favoris = new Set();

        function showToast(m) {
            const t = document.getElementById('toast'); t.innerText = m; t.style.top = "20px";
            setTimeout(() => t.style.top = "-60px", 2000);
        }

       function toggleFav(n) {
    if(favoris.has(n)) {
        // La petite notification de confirmation
        if(confirm(`Voulez-vous vraiment enlever "${n}" de vos favoris ?`)) {
            favoris.delete(n);
            showToast("Retiré des favoris 💔");
        }
    } else {
        favoris.add(n);
        showToast("Ajouté aux favoris ❤️");
    }
    updateFavUI();
}

        function updateFavUI() {
            const l = document.getElementById('fav-list');
            l.innerHTML = favoris.size ? "" : "<p>Aucun favori.</p>";
            favoris.forEach(n => l.innerHTML += `<div style="background:white; padding:15px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between;"><b>${n}</b><span onclick="toggleFav('${n}')">❌</span></div>`);
        }

        // Marqueurs
        function addPlace(lat, lng, nom, type) {
            let emoji = type === 'resto' ? '🍜' : '🕌';
            let marker = L.marker([lat, lng]).addTo(map);
            marker.bindPopup(`<b>${nom}</b><br><button onclick="toggleFav('${nom}')" style="background:#2e7d32; color:white; border:none; border-radius:10px; padding:5px 10px; margin-top:5px;">❤️ Favoris</button>`);
            return marker;
        }

        const m1 = addPlace(37.5332, 126.9977, "Grande Mosquée de Séoul", "mosquee");
    

        // Recherche & Vol
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter' && e.target.value.toLowerCase().includes('itaewon')) {
                map.flyTo([37.5332, 126.9977], 16);
                setTimeout(() => m1.openPopup(), 2000);
            }
        });

        // GPS Pin Bleu
        var userMarker;
        function findMe() { map.locate({setView: true, maxZoom: 16}); }
        map.on('locationfound', (e) => {
            if(userMarker) userMarker.setLatLng(e.latlng);
            else userMarker = L.circleMarker(e.latlng, {radius:8, fillColor:"#2196F3", color:"white", weight:3, opacity:1, fillOpacity:1}).addTo(map);
        });

        // Navigation
        function showView(v) {
            closePanels();
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(v !== 'map') document.getElementById('panel-'+v).classList.add('active');
            if(v === 'fav') document.querySelectorAll('.nav-item')[1].classList.add('active');
            if(v === 'profile') document.querySelectorAll('.nav-item')[2].classList.add('active');
            if(v === 'map') document.querySelectorAll('.nav-item')[0].classList.add('active');
        }
        function closePanels() { document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active')); }
    </script>
</body>
</html>

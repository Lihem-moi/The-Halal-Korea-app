<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Halal Korea</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://i.ibb.co/L6vV3Y9/the-halal-korea-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: white; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .header { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; background: white; padding: 10px 20px; border-radius: 25px; border: 2px solid #2e7d32; font-weight: bold; color: #2e7d32; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .locate-btn { position: absolute; bottom: 30px; right: 20px; z-index: 1000; background: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: none; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">🇰🇷 The Halal Korea</div>
    <div id="map"></div>
    <button class="locate-btn" onclick="findMe()">📍</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // SECURITÉ ANTI-DOUBLE CARTE
        var container = L.DomUtil.get('map');
        if (container != null) { container._leaflet_id = null; }

        var map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 12);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

        // Marqueur test
        L.marker([37.5332, 126.9977]).addTo(map).bindPopup("Mosquée d'Itaewon");

        // Fonction de localisation
        function findMe() {
            map.locate({setView: true, maxZoom: 16});
        }
        map.on('locationfound', function(e) {
            L.circle(e.latlng, {radius: 10}).addTo(map);
            L.marker(e.latlng).addTo(map).bindPopup("Vous êtes ici").openPopup();
        });
    </script>
</body>
</html>

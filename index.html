<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Halal Korea</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Halal Korea">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-green: #2e7d32; --accent-gold: #fbc02d; --bg-light: #f8f9fa; --heart-red: #e91e63; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: white; }
        
        #map { width: 100%; height: 100%; background: #e5e3df; z-index: 1; }

        /* Interface du haut */
        .top-interface { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); z-index: 2000; width: 90%; max-width: 400px; }
        .search-wrapper { position: relative; margin-bottom: 12px; }
        .search-bar { width: 100%; padding: 12px 12px 12px 45px; border-radius: 30px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 16px; outline: none; box-sizing: border-box; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); z-index: 2001; }

        .filters-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .filters-container::-webkit-scrollbar { display: none; }
        .filter-btn { background: white; border: none; padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.1); color: #555; }

        /* Notification Toast */
        #toast { position: absolute; top: -60px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 25px; border-radius: 30px; z-index: 5000; transition: top 0.4s; font-size: 14px; white-space: nowrap; }

        /* Panneaux Coulissants */
        .view-panel { position: absolute; bottom: -100%; left: 0; width: 100%; height: 85%; background: var(--bg-light); z-index: 3000; border-radius: 30px 30px 0 0; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1); padding: 25px; box-sizing: border-box; overflow-y: auto; }
        .view-panel.active { bottom: 0; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        /* Menu du bas */
        .bottom-nav { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 4000; width: 90%; max-width: 400px; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-radius: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .nav-item { color: #888; font-size: 20px; border: none; background: none; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--main-green); }
        .nav-label { font-size: 10px; font-weight: bold; display: block; }

        .locate-btn { position: absolute; bottom: 115px; right: 20px; z-index: 2000; background: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: none; font-size: 22px; }
        
        /* Design des items de listes */
        .fav-item { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div id="install-container" style="display: none; position: absolute; top: 110px; left: 50%; transform: translateX(-50%); z-index: 5000; width: 90%; max-width: 400px;">
    <button id="btnInstall" style="width: 100%; background: var(--accent-gold); color: #000; border: none; padding: 12px; border-radius: 25px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
        📲 Installer l'application (Plein Écran)
    </button>
</div>
    <div id="toast"></div>

    <div class="top-interface">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-bar" placeholder="Chercher Itaewon...">
        </div>
        <div class="filters-container">
            <button class="filter-btn">Tous</button>
            <button class="filter-btn">🕌 Mosquées</button>
            <button class="filter-btn">🤲🏻 Salles de prière</button>
        </div>
    </div>

    <div id="map"></div>
    <button class="locate-btn" onclick="findMe()">📍</button>

    <div id="panel-fav" class="view-panel">
        <div class="panel-header"><h2>Mes Favoris ⭐</h2><span onclick="showView('map')" style="font-size: 24px; cursor: pointer;">✕</span></div>
        <div id="fav-list"><p style="text-align:center; color:#999;">Aucun favori pour le moment.</p></div>
    </div>

    <div id="panel-profile" class="view-panel">
        <div class="panel-header"><h2>Mon Compte 👤</h2><span onclick="showView('map')" style="font-size: 24px; cursor: pointer;">✕</span></div>
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="width: 80px; height: 80px; background: #ddd; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 35px;">👤</div>
            <h3>Explorateur Halal</h3>
        </div>
        <div style="background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px;">⚙️ Paramètres</div>
        <div style="background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; color: #e91e63; font-weight: bold; text-align: center;">Déconnexion</div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showView('map')">📍<span class="nav-label">Carte</span></button>
        <button class="nav-item" onclick="showView('fav')">⭐<span class="nav-label">Favoris</span></button>
        <button class="nav-item" onclick="showView('profile')">👤<span class="nav-label">Profil</span></button>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { noWrap: true }).addTo(map);

        let mesFavoris = new Set();

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.top = "25px";
            setTimeout(() => { t.style.top = "-60px"; }, 2500);
        }

        // --- GESTION DES FAVORIS ---
        function toggleFav(nomLieu) {
            if (mesFavoris.has(nomLieu)) {
                mesFavoris.delete(nomLieu);
                showToast(`💔 ${nomLieu} retiré des favoris`);
            } else {
                mesFavoris.add(nomLieu);
                showToast(`❤️ ${nomLieu} ajouté aux favoris !`);
            }
            updateFavUI();
            map.closePopup();
        }

        function updateFavUI() {
            const liste = document.getElementById('fav-list');
            if (mesFavoris.size === 0) {
                liste.innerHTML = '<p style="text-align:center; color:#999;">Aucun favori pour le moment.</p>';
            } else {
                liste.innerHTML = "";
                mesFavoris.forEach(lieu => {
                    liste.innerHTML += `<div class="fav-item"><span>⭐ ${lieu}</span><input type="checkbox" checked onclick="toggleFav('${lieu}')"></div>`;
                });
            }
        }

        // --- MARQUEURS ---
        var mosqueIcon = L.divIcon({
            className: 'm-icon',
            html: `<div style="background:var(--main-green); color:white; width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:3px solid white; box-shadow:0 3px 10px rgba(0,0,0,0.3)">Mosquée</div>`,
            iconSize: [35, 35], iconAnchor: [17, 17]
        });

        var mItaewon = L.marker([37.5332, 126.9977]).addTo(map); // Marqueur simple pour le test
        mItaewon.bindPopup(`
            <b>Grande Mosquée de Séoul</b><br>
            <button onclick="toggleFav('Grande Mosquée')" style="background:var(--main-green); color:white; border:none; padding:8px 15px; border-radius:20px; margin-top:10px; cursor:pointer; font-weight:bold;">❤️ Favoris</button>
        `);

        // --- RECHERCHE & VOL ---
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                if(this.value.toLowerCase().includes('itaewon')) {
                    map.flyTo([37.5332, 126.9977], 15, { duration: 2 });
                    setTimeout(() => { mItaewon.openPopup(); }, 2200);
                }
            }
        });

        // --- GPS & PIN BLEU ---
        var userMarker;
        function findMe() { map.locate({setView: true, maxZoom: 16}); }
        map.on('locationfound', function(e) {
            if (userMarker) { userMarker.setLatLng(e.latlng); } 
            else {
                userMarker = L.circleMarker(e.latlng, { radius: 8, fillColor: "#2196F3", color: "white", weight: 3, opacity: 1, fillOpacity: 1 }).addTo(map);
            }
        });

        // --- NAVIGATION ---
        function showView(view) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(view === 'fav') {
                document.getElementById('panel-fav').classList.add('active');
                document.querySelectorAll('.nav-item')[1].classList.add('active');
            } else if(view === 'profile') {
                document.getElementById('panel-profile').classList.add('active');
                document.querySelectorAll('.nav-item')[2].classList.add('active');
            } else {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
            }
        }

        window.onload = function() { setTimeout(function(){ map.invalidateSize(); }, 500); };

        let deferredPrompt;
const installContainer = document.getElementById('install-container');
const btnInstall = document.getElementById('btnInstall');

// Le navigateur détecte si le site PEUT être une application
window.addEventListener('beforeinstallprompt', (e) => {
    // On empêche Chrome d'afficher sa petite barre habituelle
    e.preventDefault();
    // On garde l'événement précieusement
    deferredPrompt = e;
    // On montre NOTRE bouton personnalisé
    installContainer.style.display = 'block';
});

btnInstall.addEventListener('click', (e) => {
    // On cache notre bouton
    installContainer.style.display = 'none';
    // On montre la fenêtre d'installation officielle
    deferredPrompt.prompt();
    // On attend la réponse de l'utilisateur
    deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
            console.log('L\'utilisateur a installé l\'app');
        }
        deferredPrompt = null;
    });
});

// Si l'app est déjà installée, on cache le bouton
window.addEventListener('appinstalled', (evt) => {
    installContainer.style.display = 'none';
});
    </script>
</body>
</html>

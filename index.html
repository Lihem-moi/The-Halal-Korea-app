<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Halal Korea</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-green: #2e7d32; --accent-gold: #fbc02d; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #map { width: 100%; height: 100%; background: #e5e3df; z-index: 1; }

        /* Barre de recherche et Filtres */
        .top-interface { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); z-index: 2000; width: 90%; max-width: 400px; }
        .search-wrapper { position: relative; margin-bottom: 15px; }
        .search-bar { width: 100%; padding: 12px 12px 12px 45px; border-radius: 30px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 16px; outline: none; box-sizing: border-box; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); }

        /* Filtres (Point 2) */
        .filters-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .filters-container::-webkit-scrollbar { display: none; }
        .filter-btn { background: white; border: none; padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.1); color: #555; }
        .filter-btn.active { background: var(--main-green); color: white; }

        /* Menu du bas */
        .bottom-nav { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 2000; width: 90%; max-width: 400px; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-radius: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .nav-item { color: #888; font-size: 20px; text-decoration: none; text-align: center; border: none; background: none; }
        .nav-item.active { color: var(--main-green); }
        .nav-label { font-size: 10px; display: block; font-weight: bold; }

        .locate-btn { position: absolute; bottom: 115px; right: 20px; z-index: 2000; background: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: none; font-size: 22px; }
    </style>
</head>
<body>

    <div class="top-interface">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-bar" placeholder="Chercher Itaewon, Seoul...">
        </div>
        <div class="filters-container">
            <button class="filter-btn active">Tous</button>
            <button class="filter-btn">🕌 Mosquées</button>
            <button class="filter-btn">🧎 Salles de prière</button>
            <button class="filter-btn">🛒 Épiceries</button>
        </div>
    </div>

    <div id="map"></div>

    <button class="locate-btn" onclick="findMe()">📍</button>

    <nav class="bottom-nav">
        <button class="nav-item active">📍<span class="nav-label">Carte</span></button>
        <button class="nav-item">⭐<span class="nav-label">Favoris</span></button>
        <button class="nav-item">👤<span class="nav-label">Profil</span></button>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { noWrap: true }).addTo(map);

        // --- Marqueurs Design (Lieux de culte) ---
        var mosqueIcon = L.divIcon({
            className: 'm-icon',
            html: `<div style="background:var(--main-green); color:white; width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:3px solid white; box-shadow:0 3px 10px rgba(0,0,0,0.3)">🕌</div>`,
            iconSize: [35, 35], iconAnchor: [17, 17]
        });

        var prayerIcon = L.divIcon({
            className: 'p-icon',
            html: `<div style="background:var(--accent-gold); color:white; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white; box-shadow:0 3px 10px rgba(0,0,0,0.3)">🧎</div>`,
            iconSize: [30, 30], iconAnchor: [15, 15]
        });

        // Ajout des lieux
        L.marker([37.5332, 126.9977], {icon: mosqueIcon}).addTo(map).bindPopup("<b>Grande Mosquée de Séoul</b><br>Quartier d'Itaewon");
        L.marker([37.4493, 126.7011], {icon: mosqueIcon}).addTo(map).bindPopup("<b>Mosquée Al-Falah</b><br>Incheon");
        L.marker([37.5403, 127.0692], {icon: prayerIcon}).addTo(map).bindPopup("<b>Salle de prière Konkuk</b><br>Université Konkuk");

        // --- Fonction Recherche Simple (Point 4) ---
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                var val = this.value.toLowerCase();
                if(val.includes('itaewon')) {
                    map.flyTo([37.5332, 126.9977], 15);
                } else {
                    alert("Quartier bientôt disponible ! Testez 'Itaewon'");
                }
            }
        });

        function findMe() { map.locate({setView: true, maxZoom: 16}); }
        window.onload = function() { setTimeout(function(){ map.invalidateSize(); }, 500); };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Halal Korea</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-green: #2e7d32; --accent-gold: #fbc02d; --bg-light: #f8f9fa; --heart-red: #e91e63; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: white; }
        
        #map { width: 100%; height: 100%; background: #e5e3df; z-index: 1; }

        /* Interface du haut */
        .top-interface { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); z-index: 2000; width: 90%; max-width: 400px; }
        .search-bar { width: 100%; padding: 12px 12px 12px 45px; border-radius: 30px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 16px; outline: none; box-sizing: border-box; }
        .search-icon { position: absolute; left: 15px; top: 13px; z-index: 2001; }

        /* Fenêtres coulissantes */
        .view-panel { 
            position: absolute; bottom: -100%; left: 0; width: 100%; height: 80%; 
            background: var(--bg-light); z-index: 3000; border-radius: 30px 30px 0 0; 
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            padding: 25px; box-sizing: border-box;
        }
        .view-panel.active { bottom: 0; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        /* Style des Popups Leaflet */
        .leaflet-popup-content-wrapper { border-radius: 15px; padding: 5px; }
        .btn-fav-add { 
            background: var(--main-green); color: white; border: none; padding: 8px 12px; 
            border-radius: 20px; margin-top: 10px; cursor: pointer; width: 100%;
            font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px;
        }

        /* Notification */
        #toast { 
            position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 10px 20px; border-radius: 25px;
            z-index: 5000; transition: top 0.5s; font-size: 14px;
        }

        /* Menu du bas */
        .bottom-nav { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 4000; width: 90%; max-width: 400px; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-radius: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .nav-item { color: #888; font-size: 20px; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: var(--main-green); }
        .nav-label { font-size: 10px; font-weight: bold; }
        
        .locate-btn { position: absolute; bottom: 115px; right: 20px; z-index: 2000; background: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: none; font-size: 22px; }
    </style>
</head>
<body>

    <div id="toast">Ajouté aux favoris ! ❤️</div>

    <div class="top-interface">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-bar" placeholder="Chercher Itaewon, Seoul...">
    </div>

    <div id="map"></div>
    <button class="locate-btn" onclick="findMe()">📍</button>

    <div id="panel-fav" class="view-panel">
        <div class="panel-header">
            <h2>Mes Favoris ⭐</h2>
            <div onclick="closePanels()" style="cursor:pointer; font-size:24px;">✕</div>
        </div>
        <div id="fav-list">
            <p style="text-align: center; color: #999;">Votre liste est vide.</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showView('map')">📍<span class="nav-label">Carte</span></button>
        <button class="nav-item" onclick="showView('fav')">⭐<span class="nav-label">Favoris</span></button>
        <button class="nav-item" onclick="showView('profile')">👤<span class="nav-label">Profil</span></button>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { noWrap: true }).addTo(map);

        // Icones
        var mosqueIcon = L.divIcon({
            className: 'm-icon',
            html: `<div style="background:var(--main-green); color:white; width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:3px solid white; box-shadow:0 3px 10px rgba(0,0,0,0.3)">🕌</div>`,
            iconSize: [35, 35], iconAnchor: [17, 17]
        });

        // Fonction pour ajouter aux favoris
        function addToFav(name) {
            const toast = document.getElementById('toast');
            toast.style.top = "20px";
            setTimeout(() => { toast.style.top = "-50px"; }, 2000);
            
            const list = document.getElementById('fav-list');
            if(list.innerHTML.includes('vide')) list.innerHTML = '';
            list.innerHTML += `<div style="background:white; padding:15px; border-radius:15px; margin-bottom:10px; box-shadow:0 2px 5px rgba(0,0,0,0.05)"><b>${name}</b></div>`;
        }

        // Marqueur avec bouton favoris
        const m1 = L.marker([37.5332, 126.9977], {icon: mosqueIcon}).addTo(map);
        m1.bindPopup(`
            <b>Grande Mosquée de Séoul</b><br>
            <button class="btn-fav-add" onclick="addToFav('Grande Mosquée')">
                <span>❤️</span> Favoris
            </button>
        `);

        // Navigation
        function showView(view) {
            closePanels();
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(view === 'fav') {
                document.getElementById('panel-fav').classList.add('active');
                document.querySelectorAll('.nav-item')[1].classList.add('active');
            } else {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
            }
        }

        function closePanels() {
            document.getElementById('panel-fav').classList.remove('active');
        }

        function findMe() { map.locate({setView: true, maxZoom: 16}); }
        window.onload = function() { setTimeout(function(){ map.invalidateSize(); }, 500); };
    </script>
</body>
</html>
